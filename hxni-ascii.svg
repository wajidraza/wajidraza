<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" width="420" height="560">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <style>
      .bg { fill: #0a0a0c; stroke: #2a2415; stroke-width: 1.5; }
      .title { fill: #D4AF37; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
      .ascii-text { fill: #D4AF37; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 7.5px; line-height: 9px; white-space: pre; font-weight: 500; text-shadow: 0 0 10px rgba(212,175,55,0.28); }
      @keyframes fin { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
      .line { animation: fin 0.4s ease-out forwards; }
    </style>
  </defs>
  
  <!-- Terminal Card -->
  <rect class="bg" x="4" y="4" width="412" height="552" rx="12" />
  
  <!-- Header Bar -->
  <rect x="4" y="4" width="412" height="32" rx="12" fill="#12100b" />
  <rect x="4" y="24" width="412" height="12" fill="#12100b" />
  <line x1="4" y1="36" x2="416" y2="36" stroke="#2a2415" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="22" cy="20" r="5" fill="#ff5f56" />
  <circle cx="38" cy="20" r="5" fill="#ffbd2e" />
  <circle cx="54" cy="20" r="5" fill="#27c93f" />
  
  <!-- Title -->
