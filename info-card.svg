<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560">
  <defs>
    <style>
      .bg { fill: #0a0a0c; stroke: #2a2415; stroke-width: 1.5; }
      .title { fill: #D4AF37; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
      .term-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; font-weight: 500; }
      .key { fill: #D4AF37; font-weight: 700; }
      .val { fill: #d1d5db; }
      .accent { fill: #FFE082; font-weight: 600; }
      .comment { fill: #6b7280; font-style: italic; }
      @keyframes fin { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
      .line { animation: fin 0.4s ease-out forwards; }
    </style>
  </defs>
  
  <!-- Terminal Card -->
  <rect class="bg" x="4" y="4" width="472" height="552" rx="12" />
  
  <!-- Header Bar -->
  <rect x="4" y="4" width="472" height="32" rx="12" fill="#12100b" />
  <rect x="4" y="24" width="472" height="12" fill="#12100b" />
  <line x1="4" y1="36" x2="476" y2="36" stroke="#2a2415" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="22" cy="20" r="5" fill="#ff5f56" />
  <circle cx="38" cy="20" r="5" fill="#ffbd2e" />
  <circle cx="54" cy="20" r="5" fill="#27c93f" />
  
  <!-- Title -->
  <text x="240.0" y="24" text-anchor="middle" class="title">wajid@archlinux: ~ (The Cipher Stack)</text>
  
