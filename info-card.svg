    </text>
    <text x="0" y="374" class="term-text line" style="animation-delay: 0.51s;">
      <tspan class="key">GitHub     :</tspan> <tspan class="val">github.com/wajidraza</tspan>
    </text>
    <text x="0" y="400" class="term-text line" style="animation-delay: 0.54s;">
      <tspan class="key">Status     :</tspan> <tspan class="val">🟢 Ready for High-Impact Engineering Roles</tspan>
    </text>
